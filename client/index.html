<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Enamorado Radio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Kill any old floating live button -->
    <style>
      /* kill the legacy header player/badge */
      #listen-live,
      .listen-live,
      .listen-live-btn,
      .header-player,
      .header .player,
      .header .listen-live,
      button[data-player],
      a[href*="listen"], 
      a[aria-label*="Listen Live"],
      [data-live-button], 
      .live-button,
      .fixed.top-4.right-4,
      .fixed.top-0.right-0,
      .fixed.top-2.right-2,
      .fixed.top-6.right-6 {
        display: none !important;
        visibility: hidden !important;
      }
    </style>

    <!-- Sticky Player -->
    <div id="radio-bar" role="region" aria-label="Radio player">
      <button id="radio-toggle" class="rp-btn" aria-label="Play" data-state="paused">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M8 5v14l11-7z" fill="currentColor"></path>
        </svg>
      </button>

      <div id="radio-meta">
        <div id="radio-title" class="ticker" aria-live="polite">
          <div class="ticker__inner">
            <span class="ticker__item" id="radio-text">Enamorado Radio</span>
            <span class="ticker__item" aria-hidden="true">Enamorado Radio</span>
          </div>
        </div>
        <div id="radio-sub">Live</div>
      </div>

      <div class="rp-right">
        <input id="radio-volume" type="range" min="0" max="1" step="0.01" value="0.9" aria-label="Volume"/>
      </div>

      <audio id="radio-audio" preload="none" crossorigin="anonymous" playsinline></audio>
    </div>

    <style>
      :root{
        --rp-bg:#111; --rp-fg:#fff; --rp-accent:#ff453a; --rp-dim:#9aa0a6;
        --rp-border:#222; --rp-height:64px;
      }
      #radio-bar{
        position:fixed; left:0; right:0; bottom:0; z-index:9999;
        display:flex; align-items:center; gap:12px;
        height:var(--rp-height); padding:10px 14px;
        background:var(--rp-bg); color:var(--rp-fg); border-top:1px solid var(--rp-border);
        box-shadow:0 -2px 14px rgba(0,0,0,.25);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Inter, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      }
      .rp-btn{
        display:grid; place-items:center; width:40px; height:40px; border-radius:999rem;
        border:1px solid rgba(255,255,255,.15); background:var(--rp-accent); color:#fff; cursor:pointer;
        transition:transform .08s ease, filter .2s ease;
      }
      .rp-btn:active{ transform:scale(.97); }
      #radio-meta{ min-width:0; display:flex; flex-direction:column; line-height:1.15; flex:1; }
      #radio-title{ font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      #radio-sub{ font-size:12px; color:var(--rp-dim); }
      
      /* Ticker/Marquee styles */
      .ticker{ flex:1; min-width:0; overflow:hidden; white-space:nowrap;
        -webkit-mask-image:linear-gradient(90deg,transparent, #000 16px, #000 calc(100% - 16px), transparent);
        mask-image:linear-gradient(90deg,transparent, #000 16px, #000 calc(100% - 16px), transparent); }
      .ticker__inner{ display:flex; gap:2rem; width:max-content;
        animation:scroll var(--ticker-dur,12s) linear infinite; }
      .ticker:not(.is-overflow) .ticker__inner{ animation:none; }
      /* Hide duplicate copy when not scrolling */
      .ticker:not(.is-overflow) .ticker__item[aria-hidden="true"]{ display:none; }
      @keyframes scroll{ from{transform:translateX(0)} to{transform:translateX(-50%)} }
      
      /* Respect users who prefer no motion */
      @media (prefers-reduced-motion: reduce){
        .ticker__inner{ animation:none !important; }
      }
      .rp-right{ margin-left:auto; display:flex; align-items:center; gap:10px; }
      #radio-volume{ width:160px; accent-color:var(--rp-accent); }
      body{ padding-bottom:var(--rp-height); }
      
      /* Mobile adjustments */
      @media (max-width: 640px) {
        #radio-volume{ display:none; }
        .rp-right{ margin-left:8px; }
      }
    </style>

    <script type="module" src="/sticky-player.js"></script>
  </body>
</html>
